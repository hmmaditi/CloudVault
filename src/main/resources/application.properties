spring.application.name=cloudvault
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.bucketName=${AWS_BUCKET_NAME}cd 
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
cloudvault.file.max-size=10485760
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n

spring.datasource.url=jdbc:postgresql://localhost:5432/cloudvault
spring.datasource.username=postgres
spring.datasource.password=Sunita#1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=change-this-development-secret-key-to-a-long-random-value
jwt.expiration=900000